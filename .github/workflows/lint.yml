name: Lint and format

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # golangci-lint loads packages that import go-rattler, so cgo flags
      # must match the native build used by `make`.
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Locate pinned go-rattler Cargo workspace
        id: rattler
        run: |
          go mod download github.com/conda-incubator/go-rattler
          source_dir="$(go list -m -f '{{.Dir}}' github.com/conda-incubator/go-rattler)"
          test -n "$source_dir"
          echo "workspace=$source_dir/internal/native" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: stable
          cache: true
          cache-workspaces: ${{ steps.rattler.outputs.workspace }}
          cache-targets: false
          cache-directories: .go-rattler-native
          cache-key: lint-linux-amd64-${{ hashFiles('go.sum') }}
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Build native go-rattler
        run: make native
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
        env:
          CGO_LDFLAGS: -L${{ github.workspace }}/.go-rattler-native/release
